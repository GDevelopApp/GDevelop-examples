version: 2.1

orbs:
  aws-cli: circleci/aws-cli@2.0.2

parameters:
  # Run the gameplay tests of *every* example, even on a branch. Set it when
  # triggering a pipeline (CircleCI UI or API) to check the whole repository
  # without waiting for the change to land on `main`.
  run-all-gameplay-tests:
    type: boolean
    default: false
  # Number of parallel containers used to run the gameplay tests of every
  # example. Raise it as more examples get gameplay tests.
  all-gameplay-tests-parallelism:
    type: integer
    default: 4
  # Same, for a branch (which usually only changes one or two games).
  changed-gameplay-tests-parallelism:
    type: integer
    default: 1
  # Branch of the GDevelop repository whose latest build is used to run the
  # gameplay tests.
  gdevelop-branch:
    type: string
    default: master

commands:
  install-gdevelop-runtime-dependencies:
    steps:
      - run:
          name: Install the runtime dependencies of GDevelop
          # Even in CLI mode, Electron needs these libraries and a display to
          # start up on a headless machine.
          command: |
            sudo apt-get update
            sudo apt-get install -y \
              libnss3 \
              libasound2t64 \
              libgbm1 \
              libgtk-3-0 \
              libxss1 \
              libatk-bridge2.0-0 \
              libdrm2 \
              libxkbcommon0 \
              xvfb

jobs:
  install:
    docker:
      - image: cimg/node:20.13.1
    steps:
      - checkout
      - run: npm install
      - run: git clone git@github.com:4ian/GDevelop.git --depth 1
      - run:
          name: Generate the cache key of GDevelop dependencies
          # Computed before the install, which can rewrite the lock files.
          command: cat GDevelop/newIDE/app/package-lock.json GDevelop/GDJS/package-lock.json | shasum -a 256 > gdevelop-dependencies-checksum.txt
      - restore_cache:
          keys:
            - gdevelop-dependencies-v1-{{ checksum "gdevelop-dependencies-checksum.txt" }}
            # fallback to using the latest cache if no exact match is found
            - gdevelop-dependencies-v1-
      - run: cd GDevelop/newIDE/app && npm install --no-audit --no-fund
      - save_cache:
          paths:
            - GDevelop/newIDE/app/node_modules
            - GDevelop/GDJS/node_modules
          key: gdevelop-dependencies-v1-{{ checksum "gdevelop-dependencies-checksum.txt" }}
      - persist_to_workspace:
          root: .
          paths:
            - node_modules # For npm install.
            # What scripts/lib/GDevelopCoreLoader.js loads from GDevelop (not the
            # whole newIDE/app: its node_modules are more than 1GB, long to persist
            # and to attach in every job).
            # Without it, the files of GDevelop would take the "type" of the
            # package.json of this repository.
            - GDevelop/newIDE/app/package.json
            - GDevelop/newIDE/app/public/libGD.js
            - GDevelop/newIDE/app/public/libGD.wasm
            - GDevelop/newIDE/app/resources/GDJS
            - GDevelop/newIDE/app/src
            # The packages required by newIDE/app/src/JsExtensionsLoader.
            - GDevelop/newIDE/app/node_modules/lodash
            - GDevelop/newIDE/app/node_modules/node-require-function
  tests:
    docker:
      - image: cimg/node:20.13.1
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run: npm run check-types
      - run: npm test
      - run: npm run check-format
  build:
    docker:
      - image: cimg/node:20.13.1
    steps:
      - checkout
      - attach_workspace:
          at: .
      # Off `main`, the build is deployed to staging: it uses the themes of the
      # staging assets for the starters re-skinned with each theme.
      - run: |
          if [ "$CIRCLE_BRANCH" = "main" ]; then
            npm run build -- --gdevelop-root-path GDevelop
          else
            npm run build -- --gdevelop-root-path GDevelop --staging
          fi
      - run: npm run check-post-build
      - persist_to_workspace:
          root: .
          paths:
            - dist
  deploy:
    docker:
      - image: cimg/node:20.13.1
    steps:
      - checkout
      - attach_workspace:
          at: .
      - aws-cli/setup
      - run:
          # The deploy uploads more than a thousand small files: the default of
          # 10 concurrent requests makes it take minutes.
          name: Upload more files in parallel
          command: aws configure set default.s3.max_concurrent_requests 64
      - run: npm run deploy -- --cf-zoneid $CLOUDFLARE_ZONE_ID --cf-token $CLOUDFLARE_TOKEN
  deploy-staging:
    docker:
      - image: cimg/node:20.13.1
    steps:
      - run:
          # A pull request from a fork has no access to the credentials.
          name: Skip if the credentials are not available
          command: |
            if [ -z "$AWS_ACCESS_KEY_ID" ]; then
              echo "No AWS credentials (pull request from a fork?): not deploying to staging."
              circleci-agent step halt
            fi
      - checkout
      - attach_workspace:
          at: .
      - aws-cli/setup
      - run:
          # The deploy uploads more than a thousand small files: the default of
          # 10 concurrent requests makes it take minutes.
          name: Upload more files in parallel
          command: aws configure set default.s3.max_concurrent_requests 64
      - run: npm run deploy -- --staging --cf-zoneid $CLOUDFLARE_ZONE_ID --cf-token $CLOUDFLARE_TOKEN

  # Run the gameplay tests of the example games with a real GDevelop: the
  # latest Linux build published on S3 by GDevelop's own CI is downloaded and
  # used to open each game in CLI mode.
  gameplay-tests:
    parameters:
      scope:
        description: >
          "all" tests every game of the repository that has gameplay tests.
          "changed" only tests the games modified compared to `main`.
        type: enum
        enum: ['all', 'changed']
        default: 'all'
      parallelism:
        description: Number of containers the games are split across.
        type: integer
        default: 1
      resource-class:
        description: >
          The games are rendered in software (no GPU on CI), which is what
          makes them slow: give them enough CPU.
        type: string
        default: large
    parallelism: << parameters.parallelism >>
    resource_class: << parameters.resource-class >>
    docker:
      # Same image as the job of the GDevelop repository that runs its
      # portable Linux build headlessly.
      - image: cimg/node:24.13.0
    working_directory: ~/GDevelop-examples

    steps:
      - checkout

      - install-gdevelop-runtime-dependencies

      - run:
          name: Install the dependencies of the scripts
          # Only the runtime dependencies are needed to run the games.
          command: npm ci --omit=dev

      - run:
          name: List the games to test
          command: |
            if [ "<< parameters.scope >>" = "changed" ]; then
              node scripts/run-gameplay-tests.js --list \
                --only-changed --base-ref=origin/main > /tmp/games.txt
            else
              node scripts/run-gameplay-tests.js --list > /tmp/games.txt
            fi
            echo "Games with gameplay tests to run:"
            cat /tmp/games.txt

      - run:
          name: Split the games across the parallel containers
          # Balanced using the durations recorded by `store_test_results` on
          # the previous runs (falls back to an even split the first time).
          command: |
            if [ -s /tmp/games.txt ]; then
              circleci tests split --split-by=timings --timings-type=filename \
                < /tmp/games.txt > /tmp/games-for-this-container.txt
            else
              : > /tmp/games-for-this-container.txt
            fi
            echo "Games for this container:"
            cat /tmp/games-for-this-container.txt

      - run:
          name: Run the gameplay tests
          # A single game can legitimately take a few minutes: the games are
          # rendered in software on CI.
          no_output_timeout: 30m
          # The failure is reported by the last step of the job, so that the
          # results and artifacts of a failing run are uploaded first (they
          # are exactly what is needed to understand the failure).
          command: |
            set +e
            node scripts/run-gameplay-tests.js \
              --projects-file=/tmp/games-for-this-container.txt \
              --gdevelop-branch=<< pipeline.parameters.gdevelop-branch >> \
              --work-dir=/tmp/gdevelop-portable \
              --artifacts-dir=/tmp/gameplay-tests-artifacts \
              --junit-path=/tmp/gameplay-tests-results/results.xml
            echo $? > /tmp/gameplay-tests-exit-code

      - store_test_results:
          path: /tmp/gameplay-tests-results
      # One folder per game, holding its results, GDevelop's output and the
      # screenshots its tests took (in `gameplay-test-screenshots/`, which the
      # results file points at with a relative path).
      - store_artifacts:
          path: /tmp/gameplay-tests-artifacts
          destination: gameplay-tests

      - run:
          name: Report whether the gameplay tests passed
          # Summarize the failures here, where the job turns red: for each
          # game, how many of its tests failed and which ones.
          command: |
            EXIT_CODE="$(cat /tmp/gameplay-tests-exit-code)"
            if [ "$EXIT_CODE" != "0" ]; then
              # For each game of the JUnit report with a failure: its path, how
              # many tests passed out of how many, and the names of the failed ones.
              awk '
                function attribute(tag, key) {
                  if (!match(tag, " " key "=\"[^\"]*\"")) return ""
                  value = substr(tag, RSTART + length(key) + 3, RLENGTH - length(key) - 4)
                  gsub(/&quot;/, "\"", value); gsub(/&lt;/, "<", value); gsub(/&gt;/, ">", value); gsub(/&amp;/, "\\&", value)
                  return value
                }
                /<testsuite / && attribute($0, "failures") + 0 > 0 {
                  print "❌ " attribute($0, "name") ": " attribute($0, "tests") - attribute($0, "failures") "/" attribute($0, "tests") " gameplay tests passed"
                }
                /<testcase / && !/\/>$/ { print "   - " attribute($0, "name") }
              ' /tmp/gameplay-tests-results/results.xml
            fi
            exit "$EXIT_CODE"

  # Check that the games are still drawn the same: their rendering tests
  # (gameplay tests named "Rendering: ...") take screenshots compared with the
  # images of `rendering-screenshots/` (see scripts/check-rendering-screenshots.js).
  # The latest build of GDevelop is used: an image that differs while the game
  # did not change is an early warning of a change of the rendering of GDevelop.
  rendering-screenshots:
    parameters:
      scope:
        description: >
          "all" checks every game with rendering tests. "changed" only checks
          the games whose project or expected images changed compared to `main`.
        type: enum
        enum: ['all', 'changed']
        default: 'all'
    resource_class: large
    docker:
      - image: cimg/node:24.13.0
    working_directory: ~/GDevelop-examples

    steps:
      - checkout
      - install-gdevelop-runtime-dependencies

      - run:
          name: Install the dependencies of the scripts
          command: npm ci --omit=dev

      - run:
          name: Check the rendering of the games
          no_output_timeout: 30m
          # The failure is reported by the last step of the job, so that the
          # screenshots and their differences are uploaded first.
          command: |
            set +e
            SCOPE_ARGS=""
            if [ "<< parameters.scope >>" = "changed" ]; then
              SCOPE_ARGS="--only-changed --base-ref=origin/main"
            fi
            node scripts/check-rendering-screenshots.js $SCOPE_ARGS \
              --gdevelop-branch=<< pipeline.parameters.gdevelop-branch >> \
              --work-dir=/tmp/gdevelop-portable \
              --artifacts-dir=/tmp/rendering-screenshots-artifacts \
              --junit-path=/tmp/rendering-screenshots-results/results.xml
            echo $? > /tmp/rendering-screenshots-exit-code

      - store_test_results:
          path: /tmp/rendering-screenshots-results
      # One folder per game, with its screenshots (in
      # `gameplay-test-screenshots/`) and, for those that differ, an image of
      # the differences next to them (`.diff.png`, differences in magenta).
      - store_artifacts:
          path: /tmp/rendering-screenshots-artifacts
          destination: rendering-screenshots

      - run:
          name: Report whether the games are drawn like their expected images
          # Summarize the differences here, where the job turns red: for each
          # game, how many of its screenshots differ and which ones.
          command: |
            EXIT_CODE="$(cat /tmp/rendering-screenshots-exit-code)"
            if [ "$EXIT_CODE" != "0" ]; then
              # For each game of the JUnit report with a difference: its path,
              # how many screenshots match out of how many, and the ones that differ.
              awk '
                function attribute(tag, key) {
                  if (!match(tag, " " key "=\"[^\"]*\"")) return ""
                  value = substr(tag, RSTART + length(key) + 3, RLENGTH - length(key) - 4)
                  gsub(/&quot;/, "\"", value); gsub(/&lt;/, "<", value); gsub(/&gt;/, ">", value); gsub(/&amp;/, "\\&", value)
                  return value
                }
                /<testsuite / && attribute($0, "failures") + 0 > 0 {
                  print "❌ " attribute($0, "name") ": " attribute($0, "tests") - attribute($0, "failures") "/" attribute($0, "tests") " screenshots match"
                }
                /<testcase / && !/\/>$/ { print "   - " attribute($0, "name") }
              ' /tmp/rendering-screenshots-results/results.xml
              echo "If the change is on purpose, update the images with: node scripts/check-rendering-screenshots.js --update"
            fi
            exit "$EXIT_CODE"

workflows:
  tests:
    jobs:
      - install
      - build:
          requires:
            - install
      - tests:
          requires:
            - install
      - deploy:
          requires:
            - build
            - tests
          filters:
            branches:
              only: main
      - deploy-staging:
          requires:
            - build
            - tests
          filters:
            branches:
              ignore: main

  # Every night (03:00 UTC): rebuild and redeploy `main`. The starters re-skinned
  # with each theme are generated by the build from the themes and assets the
  # assets repository publishes, so this is how they catch up with it. The
  # gameplay tests are not run again, as the games did not change.
  nightly-rebuild:
    triggers:
      - schedule:
          cron: '0 3 * * *'
          filters:
            branches:
              only: main
    jobs:
      - install
      - build:
          requires:
            - install
      - tests:
          requires:
            - install
      - deploy:
          requires:
            - build
            - tests

  # On `main` (or when explicitly asked for): check that every gameplay test
  # of the repository still passes.
  all-gameplay-tests:
    when:
      or:
        - equal: [main, << pipeline.git.branch >>]
        - << pipeline.parameters.run-all-gameplay-tests >>
    jobs:
      - gameplay-tests:
          name: gameplay-tests-all
          scope: 'all'
          parallelism: << pipeline.parameters.all-gameplay-tests-parallelism >>
      - rendering-screenshots:
          name: rendering-screenshots-all
          scope: 'all'

  # On a branch / Pull Request: only check the games it modifies.
  changed-gameplay-tests:
    when:
      and:
        - not:
            equal: [main, << pipeline.git.branch >>]
        - not: << pipeline.parameters.run-all-gameplay-tests >>
    jobs:
      - gameplay-tests:
          name: gameplay-tests-changed
          scope: 'changed'
          parallelism: << pipeline.parameters.changed-gameplay-tests-parallelism >>
      - rendering-screenshots:
          name: rendering-screenshots-changed
          scope: 'changed'

  # Every night (04:17 UTC): check the rendering of the games with the latest
  # build of GDevelop, which changes every day without any change here.
  nightly-rendering-screenshots:
    triggers:
      - schedule:
          cron: '17 4 * * *'
          filters:
            branches:
              only: main
    jobs:
      - rendering-screenshots:
          name: rendering-screenshots-nightly
          scope: 'all'
